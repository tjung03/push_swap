<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">push_swap · Command 후처리</title>
<desc id="desc">정렬 중 execute_cmds가 Stack 연산을 수행하면서 명령을 Command List에 저장한다. 정렬 완료 후 delete_unnecessary_commands가 인접 명령을 결합하거나 상쇄하고 print_num_cmds가 남은 명령을 출력한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="360" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">push_swap · Command 후처리</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Operation Recording · Combine / Cancel · Final Output</text>

<rect x="32" y="112" width="936" height="180" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>

<rect x="60" y="158" width="190" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="80" y="187" font-size="17" font-weight="700" fill="#086b62">execute_cmds()</text>
<text x="80" y="214" font-size="14" fill="#263a54">Stack 연산 수행</text>

<rect x="290" y="158" width="190" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="310" y="187" font-size="17" font-weight="700" fill="#086b62">Command List</text>
<text x="310" y="214" font-size="14" fill="#263a54">연산 순서 저장</text>

<rect x="520" y="158" width="230" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="540" y="187" font-size="17" font-weight="700" fill="#086b62">결합 · 상쇄</text>
<text x="540" y="214" font-size="14" fill="#263a54">ss · rr · rrr / 역연산 제거</text>

<rect x="790" y="158" width="150" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="810" y="187" font-size="17" font-weight="700" fill="#086b62">최종 출력</text>
<text x="810" y="214" font-size="14" fill="#263a54">print_num_cmds()</text>

<path d="M250 201 H280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480 201 H510" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750 201 H780" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<text x="60" y="326" font-size="14" fill="#475569">정렬 연산을 즉시 출력하지 않고 저장한 뒤 후처리하기 때문에 상쇄·동시 연산 결합을 적용할 수 있음</text>
</g></svg>