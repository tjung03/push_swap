<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">push_swap · 정렬 처리 흐름</title><desc id="desc">입력을 검증해 Stack A를 구성하고 5개 이하와 6개 이상으로 정렬 경로를 나눈다. 큰 입력은 두 pivot으로 재귀 분할하고, 실행 명령을 목록에 저장한 뒤 결합과 상쇄를 거쳐 출력한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="480" rx="16" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">push_swap · 정렬 처리 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">입력 검증 · 크기별 정렬 · 재귀 분할 · 명령 후처리</text>
<rect x="32" y="105" width="936" height="93" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="137" font-size="17" font-weight="700" fill="#4865a0">01  입력</text>
<rect x="210" y="123" width="250" height="57" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="230" y="158" font-size="18" font-weight="700" fill="#163b76">정수 형식 · 범위 · 중복 검사</text>
<rect x="550" y="123" width="210" height="57" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="570" y="158" font-size="18" font-weight="700" fill="#163b76">Stack A 구성</text>
<path d="M460 151 H540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="214" width="936" height="127" rx="12" fill="#fff" stroke="#b8c7e3"/>
<text x="52" y="246" font-size="17" font-weight="700" fill="#4865a0">02  정렬</text>
<rect x="185" y="238" width="190" height="77" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="205" y="267" font-size="17" font-weight="700" fill="#163b76">원소 수 ≤ 5</text><text x="205" y="293" font-size="14" fill="#263a54">소규모 전용 정렬</text>
<rect x="405" y="238" width="190" height="77" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="425" y="267" font-size="17" font-weight="700" fill="#163b76">원소 수 ≥ 6</text><text x="425" y="293" font-size="14" fill="#263a54">두 Pivot 선택</text>
<rect x="625" y="238" width="190" height="77" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="645" y="267" font-size="17" font-weight="700" fill="#163b76">A ↔ B 분할</text><text x="645" y="293" font-size="14" fill="#263a54">Push · Rotate · 재귀 처리</text>
<path d="M595 276 H615" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="357" width="936" height="91" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="52" y="389" font-size="17" font-weight="700" fill="#086b62">03  명령 출력</text>
<text x="205" y="391" font-size="18" font-weight="700" fill="#086b62">Command List 저장 → 인접 명령 결합·상쇄 → sa/pb/rr/... 최종 출력</text>
<text x="205" y="420" font-size="15" fill="#263a54">정렬 연산은 즉시 출력하지 않고 후처리 후 출력</text>
</g></svg>