<text x="167" y="339" font-size="14" fill="#263a54">위치 · 최솟값 · 최댓값 기준</text>

<rect x="555" y="286" width="300" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="577" y="314" font-size="18" font-weight="700" fill="#163b76">6개 이상 · 두 Pivot 재귀 분할</text>
<text x="577" y="339" font-size="14" fill="#263a54">A ↔ B 분류 · 회전 복구 · 상호 재귀</text>

<line x1="770" y1="196" x2="770" y2="264" stroke="#64748b" stroke-width="2"/>
<line x1="295" y1="264" x2="705" y2="264" stroke="#64748b" stroke-width="2"/>
<line x1="295" y1="264" x2="295" y2="276" stroke="#64748b" stroke-width="2"/>
<line x1="705" y1="264" x2="705" y2="276" stroke="#64748b" stroke-width="2"/>

<text x="80" y="404" font-size="14" fill="#475569">두 경로 모두 Stack 연산을 execute_cmds()로 수행하며 생성된 명령은 별도 Command List에 저장</text>
