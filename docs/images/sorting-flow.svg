<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">push_swap · 정렬 전략</title>
<desc id="desc">입력을 검증해 Stack A를 구성한 뒤 sort_ascending이 원소 수에 따라 5개 이하 전용 정렬과 6개 이상 두 Pivot 기반 재귀 분할 정렬로 나눈다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
