<text x="32" y="74" font-size="16" fill="#4b5e78">Input Validation · Size Branch · Recursive Partition</text>

<rect x="32" y="108" width="936" height="112" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>

<rect x="125" y="132" width="210" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="145" y="170" font-size="18" font-weight="700" fill="#163b76">정수 입력 검증</text>

<rect x="395" y="132" width="210" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="415" y="159" font-size="18" font-weight="700" fill="#163b76">Stack A 구성</text>
<text x="415" y="183" font-size="14" fill="#263a54">sort_ascending()</text>

<rect x="665" y="132" width="210" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="685" y="159" font-size="18" font-weight="700" fill="#163b76">원소 수 판단</text>
<text x="685" y="183" font-size="14" fill="#263a54">≤ 5 / ≥ 6</text>

<path d="M335 164 H385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M605 164 H655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="32" y="242" width="936" height="136" rx="12" fill="#fff" stroke="#b8c7e3"/>
