<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">push_swap · 정렬 처리 흐름</title><desc id="desc">입력을 검증해 Stack A를 만든 뒤 원소 수에 따라 5개 이하 전용 정렬과 6개 이상 두 pivot 재귀 분할로 분기한다. 모든 Stack 연산은 Command List에 저장하고 정렬 후 인접 명령을 결합하거나 상쇄한 뒤 최종 명령을 출력한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
