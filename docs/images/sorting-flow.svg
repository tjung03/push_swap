<text x="575" y="301" font-size="14" fill="#263a54">두 Pivot으로 구간 분류 · 회전 복구</text>
<text x="575" y="324" font-size="14" fill="#263a54">sort_a_to_b() ↔ sort_b_to_a() 재귀</text>

