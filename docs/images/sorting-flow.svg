<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">push_swap · 정렬 처리 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">입력 검증 · 크기별 분기 · 두 Pivot 재귀 정렬 · 명령 후처리</text>

