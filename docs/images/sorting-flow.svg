<text x="220" y="155" font-size="18" font-weight="700" fill="#163b76">정수 형식 · 범위 · 중복 검사</text>
<rect x="550" y="122" width="210" height="54" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="570" y="155" font-size="18" font-weight="700" fill="#163b76">Stack A 구성</text>
